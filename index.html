<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="game-uuid" content="c8ed6c03-7f9d-492d-8bbb-8b4972d97863" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <title>Fracture Portrait</title>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <main class="fp-stage" aria-label="Fracture Portrait interactive experience">
      <canvas class="fp-canvas" aria-label="Tap the portrait to fracture the glass"></canvas>

      <header class="fp-title" aria-hidden="true">
        <span class="fp-title__index">VISUAL STUDY / 01</span>
        <h1>FRACTURE<br />PORTRAIT</h1>
      </header>

      <div class="fp-identity" aria-live="polite">
        <span class="fp-identity__line"></span>
        <span class="fp-identity__label">PORTRAIT OF</span>
        <strong class="fp-identity__name" id="identityName">YINXINGHUAN</strong>
      </div>

      <div class="fp-ghost" id="ghost" aria-hidden="true">
        <span class="fp-ghost__pulse"></span>
        <svg viewBox="0 0 24 24">
          <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.92-1.38z"/>
        </svg>
      </div>

      <div class="fp-loading" id="loading" role="status">
        <span class="fp-loading__track"><span></span></span>
        <span id="loadingText">正在显影</span>
      </div>

      <section class="fp-error" id="errorPanel" hidden>
        <strong id="errorTitle">肖像没有显现</strong>
        <span id="errorBody">请重新载入这块玻璃</span>
        <button id="retryButton" type="button">重新载入</button>
      </section>
    </main>
    <script>
      window.addEventListener('error', event => {
        window.__FRACTURE_PORTRAIT_ERROR__ = event.error?.stack || event.message;
      });
      window.addEventListener('unhandledrejection', event => {
        window.__FRACTURE_PORTRAIT_ERROR__ = event.reason?.stack || String(event.reason);
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
